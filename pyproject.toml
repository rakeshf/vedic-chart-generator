[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-chart-generator"
version = "0.1.0"
description = "Generate sidereal Vedic D1, D9, and D10 charts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pyswisseph>=2.10.3.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vedic-chart = "vedic_chart.cli:main"
vedic-chart-api = "vedic_chart.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
